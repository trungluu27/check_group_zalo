name: Build macOS App

on:
  push:
    tags:
      - 'v*'           # Trigger on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

# GITHUB_TOKEN is read-only by default; creating the Release needs write.
permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS .app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false   # an Intel-runner problem must not cancel the arm64 build
      matrix:
        include:
          - runner: macos-15          # Apple Silicon (M1/M2/M3/M4); macos-14 is retired
            arch: arm64
          - runner: macos-15-intel    # Intel Macs
            arch: x86_64

    env:
      APP: dist/ZaloGroupChecker.app
      ZIP_NAME: ZaloGroupChecker-macOS-${{ matrix.arch }}.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-${{ matrix.arch }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-pip-

      # PyInstaller is pinned to the version the Windows .exe is built with,
      # so a new PyInstaller release cannot silently break the spec.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.18.0"
          python -c "import platform; print('Python arch:', platform.machine())"

      # Build icon.icns from the current icon.png so the Dock icon always
      # matches the Windows icon (icon.ico is generated from the same PNG).
      - name: Generate icon.icns from icon.png
        run: |
          SRC=resources/icon.png
          SET=icon.iconset
          rm -rf "$SET" && mkdir "$SET"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$SRC" --out "$SET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d "$SRC" --out "$SET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$SET" -o resources/icon.icns
          ls -lh resources/icon.icns

      # Bundled driver matches the runner's Chrome. At runtime the app falls
      # back to Selenium Manager when the user's Chrome is newer.
      - name: Download ChromeDriver for bundling
        run: python resources/download_chromedriver.py

      - name: Build macOS .app
        run: pyinstaller ZaloGroupChecker.spec --noconfirm

      - name: Verify build output
        run: |
          if [ ! -d "$APP" ]; then
            echo "❌ Build failed — $APP not found"; exit 1
          fi
          du -sh "$APP"

          find "$APP" -name 'libqcocoa.dylib' | grep -q . \
            && echo "✅ Qt cocoa platform plugin present" \
            || { echo "❌ libqcocoa.dylib NOT FOUND"; exit 1; }

          find "$APP" -type f -name 'chromedriver' | grep -q . \
            && echo "✅ chromedriver bundled" \
            || { echo "❌ chromedriver NOT bundled"; exit 1; }

          find "$APP" -type f -name 'selenium-manager' | grep -q . \
            && echo "✅ selenium-manager bundled" \
            || { echo "❌ selenium-manager NOT bundled (no driver fallback)"; exit 1; }

          test -f "$APP/Contents/Info.plist" || { echo "❌ Info.plist missing"; exit 1; }
          test -f "$APP/Contents/MacOS/ZaloGroupChecker" || { echo "❌ main executable missing"; exit 1; }

          echo "--- Architecture of main executable ---"
          file "$APP/Contents/MacOS/ZaloGroupChecker"

      - name: Strip quarantine and set executable permissions
        run: |
          xattr -cr "$APP"
          chmod +x "$APP/Contents/MacOS/ZaloGroupChecker"
          find "$APP" -type f \( -name 'chromedriver' -o -name 'selenium-manager' \) \
               -exec chmod +x {} \;

      # Helper executables sitting in Contents/Resources are NOT signed by
      # `codesign --deep` (it only treats them as sealed resources). macOS
      # refuses to run an unsigned/invalid-signature binary, so sign each one
      # explicitly first, then the bundle (which seals their hashes).
      - name: Ad-hoc codesign the .app
        run: |
          find "$APP" -type f \( -name 'chromedriver' -o -name 'selenium-manager' \) \
               -print -exec codesign --force --sign - {} \;

          # Ad-hoc WITHOUT --options runtime (hardened runtime needs a real
          # Developer ID; ad-hoc + hardened = silent crash on launch).
          codesign --force --deep \
                   --entitlements resources/entitlements.plist \
                   --sign - "$APP"

          # Informational only: the Self-test step below is the real check
          # that every signed binary actually executes.
          codesign --verify --deep --strict --verbose=2 "$APP" \
            || echo "⚠️  codesign --verify reported issues (see above)"

      # Imports every lazily-loaded module (pandas, openpyxl, selenium...),
      # does an Excel round trip and executes the bundled chromedriver and
      # selenium-manager. The launch smoke test below cannot catch these.
      - name: Self-test bundled app
        run: |
          "$APP/Contents/MacOS/ZaloGroupChecker" --selftest | tee selftest.log
          grep -q "SELFTEST PASSED" selftest.log

      - name: Smoke test (launch app, capture crash)
        run: |
          BIN="$APP/Contents/MacOS/ZaloGroupChecker"
          set +e
          QT_DEBUG_PLUGINS=1 "$BIN" > smoke_stdout.log 2> smoke_stderr.log &
          PID=$!
          for i in 1 2 3 4 5 6 7 8; do
            sleep 1
            kill -0 "$PID" 2>/dev/null || break
          done
          if kill -0 "$PID" 2>/dev/null; then
            SURVIVED=1
            kill -9 "$PID" 2>/dev/null; wait "$PID" 2>/dev/null
          else
            SURVIVED=0
            wait "$PID"; echo "Exit code: $?"
          fi
          set -e

          echo "===== STDERR (tail) ====="
          tail -n 50 smoke_stderr.log || true
          DATA="$HOME/Library/Application Support/ZaloGroupChecker"
          [ -f "$DATA/startup_crash.log" ] && cat "$DATA/startup_crash.log"
          [ -f "$DATA/logs/app.log" ] && cat "$DATA/logs/app.log"

          if [ "$SURVIVED" != "1" ]; then
            echo "❌ App did NOT stay alive — crashed on launch"; exit 1
          fi
          echo "✅ App launched and stayed alive for 8s"

      # ditto (not zip) preserves the code signature & resource forks.
      - name: Create ZIP archive
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ZaloGroupChecker.app "$ZIP_NAME"
          ls -lh "$ZIP_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZaloGroupChecker-macOS-${{ matrix.arch }}
          path: dist/${{ env.ZIP_NAME }}
          retention-days: 14

      - name: Upload diagnostic logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-diagnostics-${{ matrix.arch }}
          path: |
            selftest.log
            smoke_stdout.log
            smoke_stderr.log
            /Users/runner/Library/Application Support/ZaloGroupChecker/**
          retention-days: 7
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.ZIP_NAME }}
          name: "Zalo Group Checker ${{ github.ref_name }}"
          body: |
            ## Zalo Group Checker ${{ github.ref_name }}

            ### Chọn đúng file
            - Mac chip Apple (M1/M2/M3/M4): `ZaloGroupChecker-macOS-arm64.zip`
            - Mac chip Intel: `ZaloGroupChecker-macOS-x86_64.zip`
            (Kiểm tra:  → About This Mac → Chip / Processor)

            ### Cài đặt
            1. Cài **Google Chrome**: https://www.google.com/chrome/
            2. Giải nén, kéo `ZaloGroupChecker.app` vào thư mục **Applications**
            3. Mở Terminal, chạy 1 lần:
               ```
               xattr -cr /Applications/ZaloGroupChecker.app
               ```
               (Hoặc: mở app lần đầu → bị chặn → System Settings →
               Privacy & Security → kéo xuống → **Open Anyway**)
            4. Lần chạy đầu cần có mạng: nếu Chrome của bạn mới hơn bản
               ChromeDriver đóng gói, app sẽ tự tải ChromeDriver phù hợp.

            ### Yêu cầu
            - macOS 11.0 (Big Sur) trở lên
            - Google Chrome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
